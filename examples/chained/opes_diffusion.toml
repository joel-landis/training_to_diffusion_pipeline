run_dir = "run_opes_diffusion"

[preset.mace]
model = "mh-1"
head = "matpes_r2scan"
device = "cuda"
default_dtype = "float32"
slurm = { gpus = 1 }

[preset.md]
temperature_K = 873.0
timestep_fs = 1.0
taut_fs = 20.0
log_interval_fs = 10.0
slurm = { time = "04:00:00" }

[[stage]]
task = "md"
name = "opes"
presets = ["mace", "md"]
inputs = ["<path/to/start_structure.traj>"]
plumed = "<path/to/examples/plumed/alpha_ptc.dat>"
nsteps = 50000
write_interval_fs = 100.0
seed = 5

[[stage]]
task = "opes_minimum"
name = "opes_minimum"
temperature_K = 873.0
colvar_stride = 10

[[stage]]
task = "md"
name = "diffusion"
presets = ["mace", "md"]
nsteps = 105000
write_interval_fs = 10.0
seed = 6

[[stage]]
task = "analyze"
name = "analysis"
write_interval_fs = 10.0
equilibration_ps = 20.0
cache_dir = "<path/to/analysis_cache>"
slurm = { mem_per_cpu = "2G", time = "24:00:00" }
# values of the Pt18Ga18C5 production analysis; the fit windows are set by inspecting the MSD plots
species.C = { vacf_cutoff_ps = 100.0, vacf_epsilon = 0.015, n_samples_per_block = 250, fit_start_ps = 5.0, fit_width_ps = 2.0 }
species.Pt = { vacf_cutoff_ps = 100.0, vacf_epsilon = 0.015, n_samples_per_block = 250, fit_start_ps = 50.0, fit_width_ps = 2.0 }
species.Ga = { vacf_cutoff_ps = 100.0, vacf_epsilon = 0.015, n_samples_per_block = 250, fit_start_ps = 50.0, fit_width_ps = 2.0 }

[[stage]]
task = "plot"
name = "plots"
