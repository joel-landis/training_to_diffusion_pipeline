run_dir = "run_analyze"

[[stage]]
task = "analyze"
name = "analysis"
inputs = ["<path/to/diffusion.traj>"]
write_interval_fs = 10.0
equilibration_ps = 20.0
cache_dir = "<path/to/analysis_cache>"
breakpoints_ps = []
use_global_msd = false
slurm = { mem_per_cpu = "2G", time = "24:00:00" }
# values of the Pt18Ga18C5 production analysis; the fit windows are set by inspecting the MSD plots
species.C = { vacf_cutoff_ps = 100.0, vacf_epsilon = 0.015, n_samples_per_block = 250, fit_start_ps = 5.0, fit_width_ps = 2.0 }
species.Pt = { vacf_cutoff_ps = 100.0, vacf_epsilon = 0.015, n_samples_per_block = 250, fit_start_ps = 50.0, fit_width_ps = 2.0 }
species.Ga = { vacf_cutoff_ps = 100.0, vacf_epsilon = 0.015, n_samples_per_block = 250, fit_start_ps = 50.0, fit_width_ps = 2.0 }
